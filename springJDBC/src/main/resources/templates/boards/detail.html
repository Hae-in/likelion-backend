<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 상세 조회</title>
</head>
<body>
<h1>글 상세 조회</h1>
<h3 th:text="${board.id}"></h3>
<p th:text="${board.title}"></p>
<p th:text="${board.name}"></p>
<p th:text="${board.createdAt}"></p>

<a th:href="@{/boards/list}">목록</a>
<a th:href="@{/boards/update/{id}(id=${board.id})}">수정</a>
<a th:href="@{/boards/delete/{id}(id=${board.id})}">삭제</a>
</body>
</html>
